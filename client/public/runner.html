<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style id="style"></style>
  <script>
    const consoleDiv = document.getElementById("console");
    const consoleProxy = new Proxy(console, {
      get(target, prop) {
        if (prop === 'log' || prop === 'error' || prop === 'warn') {
          return (...args) => {
            const message = args.join(' ');
            window.parent.postMessage({ typ: "console", prop, message }, "*");
            target[prop](...args);
          }
        }
        return target[prop];
      }
    });

    window.console = consoleProxy;

    function init(state) {
      window.parent.postMessage({ typ: "console", prop: "clear" }, "*");
      const style = document.head.querySelector("#style");
      style.innerHTML = state.css;
      document.head.appendChild(style);
      document.body.innerHTML = state.html;

      try {
        eval(state.js);
      } catch (err) {
        console.error(err);
      }
    }
    window.addEventListener("message", (event) => {
      const e = event.data
      if (e.typ === "init") {
        init(e.state);
      }
      if (e.typ === "reset") {
        document.location.reload();
      }
    });
    window.parent.postMessage({ typ: "ready", prop: Number(new URLSearchParams(location.search).get("v")) }, "*");
  </script>
</head>

</html>
